<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<title>主题预览 · 孤城</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="六套主题皮肤的实时预览与对比，供站长选定站点主题。">
<meta property="og:type" content="website">
<script>
/* 在样式加载前确定明暗与皮肤，避免刷新时闪出默认样式 */
(function () {
  try {
    var d = document.documentElement;
    var s = localStorage.getItem('gucheng-theme');
    /* 兼容旧键：站点曾用名时期用的键，迁一次后删掉，
       这样老访客自己选过的深浅模式不会被重置 */
    if (!s) {
      var old = localStorage.getItem('shiye-theme');
      if (old) { localStorage.setItem('gucheng-theme', old); localStorage.removeItem('shiye-theme'); s = old; }
    }
    if (!s) s = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    /* 皮肤同理：先用本地缓存预置一次，站点的真实设定等 site.json 取到后再校准 */
    d.setAttribute('data-skin', localStorage.getItem('gucheng-skin') || 'ink');
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>

        选定之后，到后台「站点设置 → 站点主题」里选好并保存，才会真正对全站生效。
