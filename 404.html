<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<title>页面不存在 · 拾页</title>
<script>
(function () {
  try {
    var s = localStorage.getItem('shiye-theme');
    if (!s) s = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', s);
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="error">

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="container">
    <div class="error-page">
      <div class="code">404</div>
      <h1>这一页不见了</h1>
      <p>你要找的页面可能已经移动、改名，或者从来没有存在过。可以回首页，或者用搜索找找看。</p>
      <div class="error-actions">
        <a class="btn" href="index.html">返回首页</a>
        <a class="btn btn--ghost" href="search.html">搜索内容</a>
        <a class="btn btn--ghost" href="archive.html">查看归档</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/vendor/marked.min.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
