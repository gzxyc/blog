<title>标签 · 孤城</title>
<meta property="og:type" content="website">
<script>
(function () {
  try {
    var d = document.documentElement;
    var s = localStorage.getItem('gucheng-theme');
    /* 兼容旧键：站点曾用名时期用的键，迁一次后删掉，
       这样老访客自己选过的深浅模式不会被重置 */
    if (!s) {
      var old = localStorage.getItem('shiye-theme');
      if (old) { localStorage.setItem('gucheng-theme', old); localStorage.removeItem('shiye-theme'); s = old; }
    }
    if (!s) s = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    /* 皮肤同理：先用本地缓存预置一次，站点的真实设定等 site.json 取到后再校准 */
    d.setAttribute('data-skin', localStorage.getItem('gucheng-skin') || 'ink');
  } catch (e) {}
})();
</script>
