<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<title>搜索 · 孤城</title>
<meta name="robots" content="noindex, follow">
<meta property="og:type" content="website">
<script>
(function () {
  try {
    var d = document.documentElement;
    var s = localStorage.getItem('gucheng-theme');
    /* 兼容旧键：站点曾用名时期用的键，迁一次后删掉，
       这样老访客自己选过的深浅模式不会被重置 */
    if (!s) {
      var old = localStorage.getItem('shiye-theme');
      if (old) { localStorage.setItem('gucheng-theme', old); localStorage.removeItem('shiye-theme'); s = old; }
    }
    if (!s) s = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    d.setAttribute('data-theme', s);
    /* 皮肤同理：先用本地缓存预置一次，站点的真实设定等 site.json 取到后再校准 */
    d.setAttribute('data-skin', localStorage.getItem('gucheng-skin') || 'ink');
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="search">

<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="container">
    <div class="layout layout--single">
      <div class="crumbs"><a href="index.html">首页</a><span class="sep">/</span><span>搜索</span></div>

      <div class="section-head">
        <h2>站内搜索</h2>
      </div>

      <div class="search-box" style="margin-bottom:30px">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <label class="visually-hidden" for="search-input">搜索关键词</label>
        <input type="search" id="search-input" placeholder="输入关键词，回车搜索…" autocomplete="off">
      </div>

      <div id="search-results">
        <div class="loading-state">正在载入内容…</div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/vendor/marked.min.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
